# Virtual Threads Configuration for Java 21+ (Week 3+)
#
# Virtual threads (Project Loom) enable high-throughput, low-latency applications
# by allowing millions of lightweight threads without the overhead of platform threads.
#
# Status: Ready for Week 3 implementation
# Java Minimum: Java 21
# Spring Boot Minimum: 3.2+

# ============================================================================
# Virtual Threads Enable
# ============================================================================
# Enable virtual threads for executor/thread pool operations
spring.threads.virtual.enabled=true

# ============================================================================
# Tomcat Configuration (for Virtual Threads)
# ============================================================================
# Configure Tomcat connector to use virtual threads for request handling
# This allows Tomcat to handle thousands of concurrent connections efficiently

# Number of virtual threads in the thread pool (tuning parameter)
# Set to -1 for unlimited (recommended for virtual threads)
server.tomcat.threads.max=500

# Minimum threads to keep alive
server.tomcat.threads.min=10

# Queue capacity for pending requests
server.tomcat.accept.count=100

# Virtual threads are more efficient than platform threads
# so we can tune these differently

# ============================================================================
# Spring Thread Pool Executor (Virtual Threads)
# ============================================================================
# Spring uses ExecutorService for async tasks and @Async methods
# Enable virtual threads for these operations

# Async task executor configuration
spring.task.execution.thread-name-prefix=virtual-
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=500
spring.task.execution.pool.queue-capacity=100

# Scheduled task executor
spring.task.scheduling.thread-name-prefix=scheduled-virtual-
spring.task.scheduling.pool.size=20

# ============================================================================
# HikariCP Connection Pool with Virtual Threads
# ============================================================================
# Virtual threads can wait on I/O efficiently, so connection pools can be
# smaller than with platform threads while handling more concurrency

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Virtual thread-aware pooling (Spring Boot 3.2+)
spring.datasource.hikari.allow-pool-suspension=true

# ============================================================================
# Performance Tuning for Virtual Threads
# ============================================================================
# These settings optimize for high concurrency scenarios

# Enable virtual threads by default for all async operations
spring.virtual-threads.enabled=true

# Disable thread context inheritance (improves performance)
# Enable only if you need thread-local context propagation
spring.virtual-threads.context-propagation=false

# ============================================================================
# Monitoring Virtual Threads
# ============================================================================
# Virtual thread metrics are available in Micrometer

# Enable detailed JVM thread metrics
management.metrics.enable.jvm=true
management.metrics.enable.jvm.threads=true

# Virtual thread metrics (Spring Boot 3.2+):
# - jvm.threads.virtual.count (gauge)
# - jvm.threads.virtual.peak (gauge)

# ============================================================================
# Debugging Virtual Threads
# ============================================================================
# For debugging, uncomment the following lines

# Enable verbose virtual thread logging (for troubleshooting)
# java -XX:+UnlockDiagnosticVMOptions -XX:+PrintVirtualThreadSchedulerStats app.jar

# Virtual thread statistics
# java -XX:+PrintVirtualThreadSchedulerStats app.jar

# ============================================================================
# Migration Guide from Platform Threads
# ============================================================================
#
# 1. Enable virtual threads (this config file)
# 2. Change @Async methods from CompletableFuture to regular methods
#    (virtual threads handle blocking I/O efficiently)
# 3. Reduce connection pool size (from 50-100 to 10-20)
# 4. Remove explicit thread pool creation (use virtual threads)
# 5. Monitor: check jvm.threads.virtual.count in Prometheus
#
# Example migration:
#
# Before (platform threads):
#   @Async
#   public CompletableFuture<Result> slowOperation() {
#       Thread.sleep(1000);  // Blocks platform thread
#       return CompletableFuture.completedFuture(...);
#   }
#
# After (virtual threads):
#   public Result slowOperation() {
#       Thread.sleep(1000);  // Virtual thread yields, platform thread available
#       return ...;
#   }
#
# The platform thread is freed for other virtual threads to run.

