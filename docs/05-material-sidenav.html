<!doctype html>
<html><head><meta charset="utf-8"><title>Material SideNav</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Roboto,Arial;background:#fafafa}.sidenav{width:280px;height:100vh;background:#fff;box-shadow:2px 0 8px #0002;color:#424242;padding-top:16px}.brand{font-size:21px;font-weight:500;padding:12px 24px 25px;color:#212121}.group{font-size:12px;color:#757575;padding:13px 24px 6px;text-transform:uppercase}.item{height:48px;display:flex;align-items:center;gap:18px;padding:0 24px;font-size:14px}.item:hover{background:#f5f5f5}.item.active{background:#e8eaf6;color:#3949ab;border-right:3px solid #3f51b5;font-weight:500}.icon{width:20px;font-size:18px}.badge{margin-left:auto;background:#3f51b5;color:#fff;border-radius:12px;padding:2px 7px;font-size:10px}
</style></head><body><nav class="sidenav"><div class="brand">Material Console</div><div class="group">Application</div><div class="item active"><span class="icon">⌂</span>Dashboard</div><div class="item"><span class="icon">▤</span>Documents<span class="badge">24</span></div><div class="item"><span class="icon">◉</span>Analytics</div><div class="group">Administration</div><div class="item"><span class="icon">♙</span>Users</div><div class="item"><span class="icon">⚙</span>Settings</div></nav></body></html>
