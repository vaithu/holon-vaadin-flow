# Holon Vaadin Flow Starter Application Configuration
# Week 2: Production Observability Setup

# ============================================================================
# Application Info
# ============================================================================
spring.application.name=holon-vaadin-flow-app
server.port=8080

# ============================================================================
# Spring Boot Actuator + Prometheus (Week 2 Implementation)
# ============================================================================
# Enable management endpoints for observability

# Expose specific endpoints (security best practice: don't expose sensitive endpoints in production)
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoints.web.base-path=/actuator

# Disable sensitive endpoints
management.endpoints.web.exposure.exclude=env,configprops

# ============================================================================
# Micrometer + Prometheus Configuration
# ============================================================================
# Export metrics to Prometheus format

management.metrics.export.prometheus.enabled=true

# Scrape step (interval for Prometheus to pull metrics)
management.metrics.export.prometheus.step=1m

# ============================================================================
# Histogram Buckets (SLO-based Latency Targets)
# ============================================================================
# Define SLO buckets for HTTP request latency percentiles
# These buckets are used to calculate p50, p95, p99 latencies

# HTTP server request SLO buckets: 10ms, 50ms, 100ms, 500ms, 1s, 5s
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,500ms,1s,5s

# Enable percentile histograms for detailed latency analysis
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ============================================================================
# Health Endpoint Configuration
# ============================================================================
# Show detailed health information when authorized (see /actuator/health)

management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.probes.enabled=true

# ============================================================================
# Logging Configuration
# ============================================================================

logging.level.root=WARN
logging.level.com.holonplatform=INFO
logging.level.org.springframework.boot=INFO

# Enable Micrometer debug logging if needed (uncomment to debug metrics)
# logging.level.io.micrometer=DEBUG

# ============================================================================
# Servlet + Container Configuration
# ============================================================================

# Virtual threads (enable in Week 2 for improved scalability)
# spring.threads.virtual.enabled=true

# Connection pool configuration for 10k concurrent users
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================================
# Vaadin Configuration
# ============================================================================

vaadin.production-mode=true

# ============================================================================
# Notes for Week 2 Implementation
# ============================================================================
#
# Metrics Endpoints:
#   - /actuator/health          Health check (readiness/liveness probes)
#   - /actuator/metrics         Available metrics list
#   - /actuator/prometheus      Prometheus scrape target (raw format)
#
# Prometheus Query Examples:
#   - rate(http_server_requests_seconds_count[1m])     # Throughput
#   - histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m]))  # p95 latency
#   - rate(http_server_requests_seconds_count{status=~"5.."}[1m])  # Error rate
#
# Load Testing:
#   - k6 run load-test.js
#   - Monitor metrics in Prometheus while test runs
#   - Compare with baseline captured in Week 1
#

