# =============================================================
# Holon Chat Module — Default (English) message bundle
#
# Bundle base name:
#   com.holonplatform.vaadin.flow.chat.i18n.ChatMessages
#
# Register with Holon LocalizationContext:
#   LocalizationContext.builder()
#       .withMessageProvider(
#           MessageProvider.fromResourceBundle(
#               "com.holonplatform.vaadin.flow.chat.i18n.ChatMessages"))
#       .build();
#
# To translate: create ChatMessages_fr.properties, etc.
# Parameters use standard Java MessageFormat syntax: {0}, {1} …
# =============================================================

