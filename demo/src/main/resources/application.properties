# Holon Vaadin Flow – Component Demo
server.port=8081
spring.application.name=holon-vaadin-flow-demo

# Vaadin dev mode: use pre-compiled frontend bundle from core module
vaadin.frontend.hotdeploy=true

# ── H2 in-memory datasource via P6Spy JDBC proxy ─────────────────────────────
spring.datasource.url=jdbc:p6spy:h2:mem:demodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver
spring.datasource.username=sa
spring.datasource.password=

# ── HikariCP connection pool ──────────────────────────────────────────────────
# minimumIdle = fixed-pool behaviour; avoids cold-start reconnection spikes
spring.datasource.hikari.minimumIdle=5
# Keep pool modest; formula: (core_count × 2) + spindle_count → tune with load tests
spring.datasource.hikari.maximum-pool-size=20
# 15 min — stays safely below most DB server wait_timeout defaults
spring.datasource.hikari.maxLifetime=900000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
# Must be false so Spring transaction management owns commit/rollback
spring.datasource.hikari.auto-commit=false
# NOTE: the properties below are MySQL Connector/J-specific.
# They have no effect on H2 (demo) but are included here for production reference.
# Remove or replace with PostgreSQL equivalents (prepareThreshold, etc.) as needed.
#spring.datasource.hikari.data-source-properties.useServerPrepStmts=false
#spring.datasource.hikari.data-source-properties.cachePrepStmts=true
#spring.datasource.hikari.data-source-properties.prepStmtCacheSize=500
#spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=1024

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop is intentional for the in-memory demo; use 'none' + Flyway in production
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Disable OSIV — prevents unintentional lazy loading outside the service layer
spring.jpa.open-in-view=false
# Consistent timestamp handling across JVMs and DB servers
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# JDBC batching — only effective when entities use GenerationType.SEQUENCE (not IDENTITY)
spring.jpa.properties.hibernate.jdbc.batch_size=15
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Skips redundant setAutoCommit(false) on every connection checkout (requires auto-commit=false above)
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
# Pads IN-clause params to powers of 2 → better query-plan cache hit rate
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
# Throws instead of silently loading all rows when paginating over a collection fetch
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
# Increase plan cache for apps with many distinct queries (default 2048)
spring.jpa.properties.hibernate.query.plan_cache_max_size=4096

# ── H2 console (dev convenience) ──────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Spring Boot Actuator + Prometheus (Production Observability) ────────────
# Enable management endpoints for metrics, health, and environment diagnostics
management.endpoints.web.exposure.include=health,metrics,prometheus,env
management.endpoints.web.base-path=/actuator
management.metrics.export.prometheus.enabled=true
# Histogram buckets for request latency (SLOs: 10ms, 50ms, 100ms, 500ms, 1s, 5s)
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,500ms,1s,5s
# Enable percentile histograms for detailed latency analysis
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Prometheus will scrape every 5s for tighter granularity
management.metrics.export.prometheus.step=5s
management.endpoint.health.show-details=when-authorized

# ── Virtual Threads Configuration (Week 3 - Java 21+) ───────────────────────
# Enable virtual threads for high-throughput, low-latency operations
# Allows handling 5,000+ concurrent users efficiently (vs. 1,000 with platform threads)
spring.threads.virtual.enabled=true

# Tomcat connector — handle requests with virtual threads
server.tomcat.threads.max=500
server.tomcat.threads.min=10
server.tomcat.accept.count=100

# Spring async task executor — @Async methods use virtual threads
spring.task.execution.thread-name-prefix=virtual-
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=500
spring.task.execution.pool.queue-capacity=100

# Spring scheduled task executor — @Scheduled methods use virtual threads
spring.task.scheduling.thread-name-prefix=scheduled-virtual-
spring.task.scheduling.pool.size=20

# Virtual thread context propagation
# Set to false for better performance (no thread-local context inheritance)
spring.virtual-threads.context-propagation=false

# Enable detailed JVM thread metrics in Prometheus
# Metrics: jvm.threads.virtual.count, jvm.threads.virtual.peak
management.metrics.enable.jvm=true
management.metrics.enable.jvm.threads=true

# Logging
logging.level.root=WARN
logging.level.com.holonplatform=INFO
logging.level.com.vaadin=INFO
logging.level.p6spy=INFO
# Micrometer trace logging (if debugging metrics)
# logging.level.io.micrometer=DEBUG

vaadin.copilot.enable=false

