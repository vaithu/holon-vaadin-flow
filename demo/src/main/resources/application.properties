# Holon Vaadin Flow – Component Demo
server.port=8081
spring.application.name=holon-vaadin-flow-demo

# Vaadin dev mode: use pre-compiled frontend bundle from core module
vaadin.frontend.hotdeploy=true

# ── H2 in-memory datasource ──────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:demodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── H2 console (dev convenience) ──────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.root=WARN
logging.level.com.holonplatform=INFO
logging.level.com.vaadin=INFO

