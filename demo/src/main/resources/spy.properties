# P6Spy configuration
# Route all SQL output through SLF4J (printed via logback to console)
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# Pretty-printed SQL formatter from holon-core
logMessageFormat=com.holonplatform.core.utils.PrettySqlFormat

# Real H2 driver behind the proxy
driverlist=org.h2.Driver

# Log all statements
filter=false
