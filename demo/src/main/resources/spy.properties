# P6Spy configuration
# Route all SQL output through SLF4J (printed via logback to console)
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# Pretty-printed SQL formatter (holon-core PrettySqlFormat) + the application call site
# that issued the statement. Swap back to com.holonplatform.core.utils.PrettySqlFormat
# to get the plain output without stack frames.
# SQL caller options are configured here; this is their single source of truth.
# Call-site resolution walks the thread stack on every statement, so it is opt-in: leaving
# it on under real concurrency is a significant, pointless cost.
logMessageFormat=com.holonplatform.vaadin.flow.demo.config.SqlCallerLogFormat
sqlcaller.enabled=true
sqlcaller.packages=com.holonplatform.vaadin.flow,com.iyensoft.vaadin.flow
sqlcaller.frames=5
sqlcaller.full=false

# NOTE: no `driverlist` and no `jdbc:p6spy:` URL prefix — the DataSource is proxied by the
# P6Spy DataSource decorator (com.github.gavlyukovskiy:p6spy-spring-boot-starter, pulled in
# transitively by holon-core). Adding the URL prefix as well double-proxies the connection
# and logs every statement twice.

# Log all statements
filter=true
