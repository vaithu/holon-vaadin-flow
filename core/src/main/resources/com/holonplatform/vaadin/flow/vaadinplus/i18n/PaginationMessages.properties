# =============================================================
# Holon VaadinPlus Core — Default (English) pagination bundle
#
# Bundle base name:
#   com.holonplatform.vaadin.flow.vaadinplus.i18n.PaginationMessages
#
# Register with Holon LocalizationContext:
#   LocalizationContext.builder()
#       .withMessageProvider(
#           MessageProvider.fromResourceBundle(
#               "com.holonplatform.vaadin.flow.vaadinplus.i18n.PaginationMessages"))
#       .build();
#
# To translate: create PaginationMessages_fr.properties, etc.
# Parameters use standard Java MessageFormat syntax: {0}, {1} …
# =============================================================

# ---- Pagination nav element ---------------------------------
# Accessible label for the <nav aria-label="…"> element
pagination.aria_label    = Page navigation

# ---- Previous / Next buttons --------------------------------
pagination.previous_aria  = Go to previous page
pagination.previous_label = Previous
pagination.next_aria      = Go to next page
pagination.next_label     = Next

# ---- Individual page links ----------------------------------
# {0} = page number, e.g. "Go to page 3"
pagination.page_aria      = Go to page {0}

# ---- Pagination status text (ItemListingPaginationBar) ------
# {0} = current page, {1} = total pages, e.g. "Page 2 of 10"
pagination.status_text    = Page {0} of {1}
